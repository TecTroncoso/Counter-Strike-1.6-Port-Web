# Render Blueprint — https://render.com/docs/blueprint-spec
# In Render's Blueprint setup, select "deploy/render/render.yaml" as the
# Blueprint Path. The Dockerfile path below is relative to the repository root.

services:
  - type: web
    name: cs16-hlds-bridge
    runtime: docker
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: ./
    # Starter keeps the game server resident. The Free plan sleeps after idle
    # and is not suitable for a production multiplayer server.
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: HLDS_DIR
        value: /app
      - key: HLDS_GAME_DIR
        value: /app/cstrike
      - key: HLDS_LOG_FILE
        value: /tmp/hlds-supervised.log
      - key: HLDS_MAP
        value: de_dust2
      - key: HLDS_MAXPLAYERS
        value: "16"
      - key: HLDS_BOT_QUOTA
        value: "9"
      # Empty QEMU means native 32-bit execution on Render's x86_64 hosts.
      - key: QEMU
        value: ""
      # Render prompts for this during Blueprint apply. Enter the exact
      # Cloudflare frontend origin, for example https://cs16-web.example.dev.
      - key: BRIDGE_ALLOWED_ORIGINS
        sync: false
      # Render creates this secret. The server uses it for privileged RCON and
      # local diagnostics can reuse it; it is never sent to the frontend or
      # included in the /health response.
      - key: HLDS_RCON_PASSWORD
        generateValue: true
